<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fading Background Image Animation Design</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

  </head>
  <body>
    <div class="container-fluid " id="back">
      <div id="texttop">
        <h1>True Cross-Fade Background Images</h1>
        <p>A repeating sequence of fullscreen background images, pushed all the way to the root element. Crossfading effect in Webkit-derived browsers (Chrome, Safari, Opera).</p>
      </div>
    </div>   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
      var bgImages = ["image/bgcute1.jpg", "image/bgcute2.jpg", "image/bgcute3.jpg", "image/bgcute4.jpg"];
      bgImages.forEach(function(img){
        new Image().src = img;
      });
      function backgroundAnimation(){
        window.clearTimeout();
        var k=0;
        for(let i=0; i<bgImages.length; i++){
          setTimeout(function(){
            document.getElementById("back").style.background = "url(" + bgImages[i] + ") no-repeat bottom right" ;
            document.getElementById("back").style.backgroundSize = "cover";
            if((k+1)=== bgImages.length){
              setTimeout(function(){backgroundAnimation()}, 3000);
            }
            else{
              k++;
            }
          }, 3000 * i);
        }     
         
      }

      backgroundAnimation();
    </script>
  </body>
</html>
